<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Painel Administrativo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div class="bg-white p-8 rounded-lg shadow-md w-96">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-gray-800">🤰 Chatbot Gestante</h1>
      <p class="text-gray-600">Painel do Administrador</p>
    </div>

    <form>
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2">E-mail</label>
        <input type="email" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="admin@saude.gov">
      </div>

      <div class="mb-6">
        <label class="block text-gray-700 text-sm font-bold mb-2">Senha</label>
        <input type="password" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••">
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Entrar</button>
    </form>

    <p class="text-center text-gray-500 text-xs mt-6">Acesso restrito a profissionais autorizados</p>
  </div>
</body>
</html>
